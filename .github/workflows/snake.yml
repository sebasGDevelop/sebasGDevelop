name: VHS Snake

on:
  schedule:
    - cron: "43 5 * * *"   # every day
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-vhs-dark.svg?palette=github-dark&color_snake=#33D6FF&color_dots=#161b22,#5a1a26,#a3263f,#e0304f,#FF3355
            dist/snake-vhs-light.svg?color_snake=#0A0A0B&color_dots=#ebedf0,#c9f2fb,#7fe2f7,#33D6FF,#1497b3

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
