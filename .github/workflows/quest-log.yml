name: Quest Log CRT

on:
  schedule:
    - cron: "23 */6 * * *"   # every 6 hours
  workflow_dispatch:          # "Run workflow" button to run it by hand
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "assets/quest-bg.png"
      - ".github/workflows/quest-log.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pixel font and libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-unifont
          pip install --quiet pillow numpy

      - name: Draw screens
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python scripts/quest_log.py

      - name: Save changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/quest-log.png assets/player-stats.png
          git diff --cached --quiet || git commit -m "Update Quest Log"
          git push
